[project]
name = "rate-limiter"
version = "0.1.0"
description = "Token-bucket rate limiter (in-memory and Redis) with a FastAPI middleware demo"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.165.0",
    "redis>=8.1.0",
    "starlette>=1.10.0",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
python_files = ["test*.py"]
